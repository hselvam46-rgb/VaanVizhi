    sms: "காற்றில் அதிக ஈரப்பதம் உள்ளதால் காய் புழுக்கள் தாக்க வாய்ப்பு. ஏக்கருக்கு 5 இனக்கவர்ச்சி பொறி வைக்கவும்."
    dlt_template_id: "DLT_TN_AGRI_COTTON_02"
  coconut_heat_button_shedding:
    sms: "கடும் வெயிலால் குரும்பை உதிரக்கூடும். மரம் ஒன்றுக்கு ஒரு நாள் விட்டு ஒரு நாள் நீர் பாய்ச்சவும்."
    dlt_template_id: "DLT_TN_AGRI_COCONUT_01"
  coconut_rhizoctonia_monsoon:
    sms: "தொடர் மழையால் குருத்து அழுகல் நோய் பரவக்கூடும். தென்னை குருத்தில் போர்டோ பசையை தடவவும்."
