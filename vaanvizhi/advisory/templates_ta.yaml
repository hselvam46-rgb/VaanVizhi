# VaanVizhi - Tamil Agromet SMS & WhatsApp Templates
# Note: Indian Telecom DLT Standard enforces ~70 characters per single Unicode SMS segment.
# Multi-segment messages cost extra and risk concatenation truncation on basic feature phones.

sms_header: "வானிலை எச்சரிக்கை (தேனி): "

templates:
  banana_spray_rain_delay:
