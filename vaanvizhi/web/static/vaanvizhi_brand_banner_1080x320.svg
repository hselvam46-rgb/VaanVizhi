<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vvRadarGrad" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f3b60" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="vvSweepGrad" x1="75" y1="75" x2="135" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="vvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f3b60" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container / Background soft pill (subtle, clean for transparent or light backgrounds) -->
  <rect x="4" y="8" width="532" height="144" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#vvGlow)"/>

  <!-- EMBLEM GRAPHIC: Left Centered at (80, 80) -->
  <g transform="translate(10, 0)">
    <!-- Outer Geo-Radar Ticks -->
    <circle cx="72" cy="80" r="54" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 6" fill="#f8fafc"/>
    <circle cx="72" cy="80" r="42" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
    <circle cx="72" cy="80" r="28" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" fill="#f0fdf4"/>

    <!-- Radar Sweep Cone -->
    <path d="M72 80 L115 50 A54 54 0 0 0 72 26 Z" fill="url(#vvSweepGrad)"/>

    <!-- Compass / Geodetic Axis Markers -->
    <line x1="72" y1="20" x2="72" y2="30" stroke="#0f3b60" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="72" y1="130" x2="72" y2="140" stroke="#0f3b60" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="80" x2="22" y2="80" stroke="#0f3b60" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="122" y1="80" x2="132" y2="80" stroke="#0f3b60" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eye / Vision Outer Contour (வானவிழி - Eye of the Sky) -->
    <path d="M38 80 C50 60 94 60 106 80 C94 100 50 100 38 80 Z" stroke="#0f3b60" stroke-width="3" stroke-linejoin="round" fill="#ffffff" fill-opacity="0.9"/>

    <!-- Iris / Micro-Grid Core -->
    <circle cx="72" cy="80" r="13" fill="#0f3b60"/>
    <circle cx="72" cy="80" r="7" fill="#0284c7"/>
    <!-- Specular Pupil Droplet -->
    <circle cx="75" cy="76" r="2.5" fill="#ffffff"/>
    
    <!-- Agro Sprout / Leaf Accent on Orbit -->
    <path d="M106 58 C116 54 122 62 118 72 C114 66 110 62 106 58 Z" fill="#10b981"/>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(162, 0)">
    <!-- Primary Brand Name -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="34" fill="#0f3b60" letter-spacing="-0.8">VaanVizhi</text>
    
    <!-- Tamil Script Brand Mark -->
    <text x="180" y="54" font-family="'Mukta Malar', 'Noto Sans Tamil', 'Inter', sans-serif" font-weight="700" font-size="22" fill="#0284c7">வானவிழி</text>

    <!-- Subtitle / Platform Mission -->
    <text x="2" y="84" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="13.5" fill="#334155" letter-spacing="0.1">Panchayat-Level Weather Intelligence &amp; Agro-Advisory</text>

    <!-- Metadata Badges & Technical Accreditations -->
    <g transform="translate(2, 98)">
      <!-- SIH Problem Statement Badge -->
      <rect x="0" y="0" width="94" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="8" y="15" font-family="'Inter', monospace" font-weight="700" font-size="10" fill="#1d4ed8" letter-spacing="0.4">PS 26074 · SIH</text>

      <!-- Downscaling Engine Tag -->
      <rect x="102" y="0" width="118" height="22" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="110" y="15" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#15803d">1.0 km² Micro-Grid</text>

      <!-- Agro Advisory Tag -->
      <rect x="228" y="0" width="112" height="22" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="236" y="15" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#475569">Decision Support</text>
    </g>
  </g>
</svg>